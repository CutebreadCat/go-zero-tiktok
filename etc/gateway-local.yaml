Name: tiktok-api
Host: 0.0.0.0
Port: 8888

Auth:
  AccessSecret: "your_access_secret"
  AccessExpire: 3600

UserRpc:
  Etcd:
    Hosts: [127.0.0.1:2379]
    Key: user.rpc

VideoRpc:
  Etcd:
    Hosts: [127.0.0.1:2379]
    Key: video.rpc

InteractionRpc:
  Etcd:
    Hosts: [127.0.0.1:2379]
    Key: interaction.rpc

CommunicationRpc:
  Etcd:
    Hosts: [127.0.0.1:2379]
    Key: communication.rpc

# 链路追踪:go-zero 内置 Telemetry(OTLP gRPC 导出,可接 Tempo/Jaeger)
# 无 trace 后端调试时,可改用 Batcher: file + Endpoint: /tmp/traces.json
Telemetry:
  Name: gateway-api
  Endpoint: localhost:4317
  Sampler: 1.0
  Batcher: otlpgrpc
