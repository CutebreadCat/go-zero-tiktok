Name: communication.rpc
ListenOn: 0.0.0.0:8893
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: communication.rpc

DataSource: "root:yourpassword@tcp(127.0.0.1:3309)/gozero-tiktok?charset=utf8mb4&parseTime=True&loc=Local"

UserRpc:
  Etcd:
    Hosts: [127.0.0.1:2379]
    Key: user.rpc

# 链路追踪:go-zero 内置 Telemetry(OTLP gRPC 导出,可接 Tempo/Jaeger)
Telemetry:
  Name: communication-rpc
  Endpoint: localhost:4317
  Sampler: 1.0
  Batcher: otlpgrpc
