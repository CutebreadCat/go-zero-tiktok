# Grafana 看板自动加载配置
# 容器内路径:/etc/grafana/provisioning/dashboards(由 docker-compose 挂载整个 provisioning 目录)
# 本目录下的 *.json 会被自动导入到 "TikTok" 文件夹,修改文件 30s 内热加载。
apiVersion: 1

providers:
  - name: tiktok
    orgId: 1
    folder: TikTok
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
