# go-zero-tiktok 前端静态托管 + 网关同源反代
#
# 拓扑（单域名同源，规避 CORS 与 Cookie SameSite 跨站问题）：
#   浏览器 ──▶ Nginx :80
#                ├── /        → frontend/dist（SPA，history 回退 index.html）
#                └── /api/*   → http://127.0.0.1:8888/*（go-zero 网关，去掉 /api 前缀）
#
# 为什么走 /api 前缀：网关的 /messages、/users/:id/videos 等路径与前端 SPA 路由同名，
# 若在同一命名空间下反代会互相覆盖；加前缀后两者彻底隔离。
#
# 使用：
#   1. cd frontend && npm ci && npm run build      # 构建期 VITE_API_BASE=/api
#   2. cp -r frontend/dist/* /var/www/go-zero-tiktok/
#   3. cp deploy/nginx/tiktok-web.conf /etc/nginx/conf.d/ && nginx -t && systemctl reload nginx

server {
    listen       80;
    server_name  _;

    # 前端构建产物目录（frontend/dist 的内容）
    root  /var/www/go-zero-tiktok;
    index index.html;

    # 视频上传等大请求体上限
    client_max_body_size 200m;

    # 压缩
    gzip            on;
    gzip_min_length 1k;
    gzip_types      text/plain text/css application/json application/javascript
                    application/xml image/svg+xml;

    # SPA：静态资源命中即返回，其余回退 index.html（支持 history 路由刷新）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 入口页不缓存，保证发版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API 同源反代：/api/users → http://127.0.0.1:8888/users
    location /api/ {
        proxy_pass         http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 视频发布/上传可能较慢，放宽读超时
        proxy_read_timeout 120s;
    }
}
