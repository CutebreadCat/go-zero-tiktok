version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - revive
    - gocritic
    - bodyclose
    - misspell
    - errorlint
    - gocognit
    - contextcheck
  disable:
    - wsl
    - nlreturn
  # 👇 v2 中 linters-settings 必须作为 linters 的子节点 settings
  settings:
    revive:
      rules:
        - name: exported
          disabled: true

# 👇 v2 废弃了 issues.exclude-rules，改用 exclusions
exclusions:
  rules:
    - path: _test\.go
      linters:
        - gocognit
        - wrapcheck
    - path: _test\.go
      text: "SA1029:"
      linters:
        - staticcheck