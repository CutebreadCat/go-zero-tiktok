services:
  etcd:
    image: registry.k8s.io/etcd:3.5.17-0
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --quota-backend-bytes=8589934592
      - --snapshot-count=1000
      - --heartbeat-interval=200
      - --election-timeout=2000
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    ports:
      - "6888:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
      MYSQL_DATABASE: gozero-tiktok
      MYSQL_USER: gozero-tiktok
      MYSQL_PASSWORD: yourpassword
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS: 6000
      KAFKA_GROUP_MAX_SESSION_TIMEOUT_MS: 60000
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # One-off migration runner (not started by `infra-up`; use `make migrate-up`)
  migrate:
    image: migrate/migrate:v4.19.1
    profiles: ["migrate"]
    volumes:
      - ./migrations:/migrations
    entrypoint: ["sh", "-c", "echo 'Run: make migrate-up' && sleep 3600"]

volumes:
  redis-data:
  mysql-data:
  kafka-data:
  etcd-data:
