syntax = "proto3";

package video;

option go_package = "./video_pb";

message PublishVideoRequest {
    int64 user_id = 1;
    string title = 2;
    string description = 3;
    bytes video_data = 4;
    string filename = 5;
}

message PublishVideoResponse {
    int64 video_id = 1;
    int64 published_at = 2;
}

message GetFeedVideoRequest {
    string last_time = 1;
    int32 page_num = 2;
    int32 page_size = 3;
    int64 viewer_id = 4;
}

// FeedFanoutRequest 关注流扇出：将某条视频写入指定用户的收件箱 feed:inbox:{uid}
// 由 gateway 编排层调用（拿粉丝列表后一次性扇出），video.rpc 内部只写自己的 Redis 索引。
message FeedFanoutRequest {
    int64 video_id = 1;
    repeated int64 user_ids = 2;
    int64 publish_at = 3;
}

message FeedFanoutResponse {
}

message VideoInfo {
    int64 video_id = 1;
    int64 author_id = 2;
    string video_url = 3;
    string cover_url = 4;
    string title = 5;
    string description = 6;
    string created_at = 7;
}

message GetFeedVideoResponse {
    repeated VideoInfo videos = 1;
    int64 total = 2;
}

message GetVideoListRequest {
    int64 author_id = 1;
    int32 page_num = 2;
    int32 page_size = 3;
}

message GetVideoListResponse {
    repeated VideoInfo videos = 1;
    int64 total = 2;
}

message SearchVideoRequest {
    string keyword = 1;
    int32 page_num = 2;
    int32 page_size = 3;
}

message SearchVideoResponse {
    repeated VideoInfo videos = 1;
    int64 total = 2;
}

message GetVideosByIDsRequest {
    repeated int64 video_ids = 1;
}

message GetVideosByIDsResponse {
    repeated VideoInfo videos = 1;
}

message GetPopularVideoRequest {
    int32 page_num = 1;
    int32 page_size = 2;
}

message VideoPopularInfo {
    int64 video_id = 1;
    int64 visit_count = 2;
    int64 like_count = 3;
    int64 comment_count = 4;
    int64 favorite_count = 5;
}

message GetPopularVideoResponse {
    repeated VideoInfo videos = 1;
    repeated VideoPopularInfo populars = 2;
}

message IncreaseVideoVisitCountRequest {
    int64 video_id = 1;
    int64 delta = 2;
}

message IncreaseVideoVisitCountResponse {
}

service VideoService {
    rpc PublishVideo(PublishVideoRequest) returns (PublishVideoResponse);
    rpc GetFeedVideo(GetFeedVideoRequest) returns (GetFeedVideoResponse);
    rpc GetVideoList(GetVideoListRequest) returns (GetVideoListResponse);
    rpc SearchVideo(SearchVideoRequest) returns (SearchVideoResponse);
    rpc GetPopularVideo(GetPopularVideoRequest) returns (GetPopularVideoResponse);
    rpc GetVideosByIDs(GetVideosByIDsRequest) returns (GetVideosByIDsResponse);
    rpc IncreaseVideoVisitCount(IncreaseVideoVisitCountRequest) returns (IncreaseVideoVisitCountResponse);
    rpc FeedFanout(FeedFanoutRequest) returns (FeedFanoutResponse);
}
