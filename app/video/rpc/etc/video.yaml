Name: video.rpc
ListenOn: 0.0.0.0:8891
Etcd:
  Hosts:
  - "${ETCD_HOSTS}"
  Key: video.rpc

DataSource: "root:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/gozero-tiktok?charset=utf8mb4&parseTime=True&loc=Local"

# 应用 Redis：Feed 候选池 feed:global ZSet
AppRedis:
  Host: "${REDIS_HOST}"
  Type: node

# 链路追踪:go-zero 内置 Telemetry(OTLP gRPC 导出,可接 Tempo/Jaeger)
Telemetry:
  Name: video-rpc
  Endpoint: "${OTLP_ENDPOINT}"
  Sampler: 1.0
  Batcher: otlpgrpc

# Kafka: 热度分重算事件（Gateway 发送）与访问事件（本服务自产自消）
Kafka:
  Brokers:
  - "${KAFKA_BROKERS}"
  HotScoreTopic: "video-hot-score-recalc"
  VisitTopic: "video-visit-events"
  GroupID: "video-hot-score-consumer-group"
  Enable: true
  WorkerCount: 10
  QueueSize: 1000

# 热度分计算与清理配置
Hot:
  BaseScore: 100          # 基础分，让新视频有初始竞争力
  LikeWeight: 5           # 点赞权重
  CommentWeight: 10       # 评论权重
  FavoriteWeight: 3       # 收藏权重
  Gravity: 1.5            # HN 时间衰减指数
  CleanupInterval: 24h    # 清理任务间隔
  Window: 24h             # 滑动窗口：超过该时长未活跃则清理
  KeepTopN: 10000         # 保留热度榜 Top N

# 监控指标:go-zero 内置 Prometheus,暴露 /metrics 供 Prometheus 抓取
Prometheus:
  Host: 0.0.0.0
  Port: 9102
  Path: /metrics
