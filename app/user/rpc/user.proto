syntax = "proto3";

package user;

option go_package = "./user_pb";

message LoginRequest {
    string username = 1;
    string password = 2;
    string mfa_code = 3;
}

message LoginResponse {
    string access_token = 1;
    string refresh_token = 2;
    int64 user_id = 3;
}

message RegisterRequest {
    string username = 1;
    string password = 2;
}

message RegisterResponse {
    int64 user_id = 1;
}

message RefreshTokenRequest {
    string refresh_token = 1;
}

message RefreshTokenResponse {
    string access_token = 1;
    string refresh_token = 2;
}

message GetUserInfoRequest {
    int64 user_id = 1;
}

message UserInfo {
    int64 user_id = 1;
    string username = 2;
    string photo_url = 3;
    string created_at = 4;
    string updated_at = 5;
}

message GetUserInfoResponse {
    UserInfo user = 1;
}

message BatchGetUserInfoRequest {
    repeated int64 user_ids = 1;
}

message BatchGetUserInfoResponse {
    repeated UserInfo users = 1;
}

message UpdateUserPhotoRequest {
    int64 user_id = 1;
    bytes photo = 2;
}

message UpdateUserPhotoResponse {
    string photo_url = 1;
}

message GetMfaQRCodeRequest {
    int64 user_id = 1;
}

message GetMfaQRCodeResponse {
    string mfa_secret = 1;
    string qr_code_url = 2;
}

message BindMfaRequest {
    int64 user_id = 1;
    string mfa_secret = 2;
    string mfa_code = 3;
}

message BindMfaResponse {
}

service UserService {
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
    rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);
    rpc BatchGetUserInfo(BatchGetUserInfoRequest) returns (BatchGetUserInfoResponse);
    rpc UpdateUserPhoto(UpdateUserPhotoRequest) returns (UpdateUserPhotoResponse);
    rpc GetMfaQRCode(GetMfaQRCodeRequest) returns (GetMfaQRCodeResponse);
    rpc BindMfa(BindMfaRequest) returns (BindMfaResponse);
}
