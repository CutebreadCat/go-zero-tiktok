Name: tiktok-api
Host: 0.0.0.0
Port: 8888

Auth:
  AccessSecret: "${ACCESS_SECRET}"
  AccessExpire: 3600
  # 公开接口白名单（免鉴权）；* 匹配任意字符（含 /）。
  # 显式配置为空列表时回退到 middleware/token.DefaultPublicPaths。
  PublicPaths:
    - /users              # POST 注册
    - /sessions           # POST 登录
    - /sessions/refresh   # POST 刷新令牌
    - /users/*/videos     # GET 作者视频列表（动态路径）
    - /videos/popular     # GET 热门视频
    - /videos/search      # GET 搜索视频

UserRpc:
  Etcd:
    Hosts: ["${ETCD_HOSTS}"]
    Key: user.rpc

VideoRpc:
  Etcd:
    Hosts: ["${ETCD_HOSTS}"]
    Key: video.rpc

InteractionRpc:
  Etcd:
    Hosts: ["${ETCD_HOSTS}"]
    Key: interaction.rpc

CommunicationRpc:
  Etcd:
    Hosts: ["${ETCD_HOSTS}"]
    Key: communication.rpc

# Kafka: 热度分重算事件 + 埋点事件
Kafka:
  Brokers:
  - "${KAFKA_BROKERS}"
  Topic: "video-hot-score-recalc"
  TrackingTopic: "tracking-events"
  Enable: true

# 链路追踪:go-zero 内置 Telemetry(OTLP gRPC 导出,可接 Tempo/Jaeger)
Telemetry:
  Name: gateway-api
  Endpoint: "${OTLP_ENDPOINT}"
  Sampler: 1.0
  Batcher: otlpgrpc

# 监控指标:go-zero 内置 Prometheus,暴露 /metrics 供 Prometheus 抓取
Prometheus:
  Host: 0.0.0.0
  Port: 9100
  Path: /metrics