Name: tiktok-api
Host: 0.0.0.0
Port: 8888

Auth:
  AccessSecret: "${ACCESS_SECRET}"
  AccessExpire: 3600

UserRpc:
  Etcd:
    Hosts: ["${ETCD_HOSTS}"]
    Key: user.rpc

VideoRpc:
  Etcd:
    Hosts: ["${ETCD_HOSTS}"]
    Key: video.rpc

InteractionRpc:
  Etcd:
    Hosts: ["${ETCD_HOSTS}"]
    Key: interaction.rpc

CommunicationRpc:
  Etcd:
    Hosts: ["${ETCD_HOSTS}"]
    Key: communication.rpc

# 链路追踪:go-zero 内置 Telemetry(OTLP gRPC 导出,可接 Tempo/Jaeger)
Telemetry:
  Name: gateway-api
  Endpoint: "${OTLP_ENDPOINT}"
  Sampler: 1.0
  Batcher: otlpgrpc

# 监控指标:go-zero 内置 Prometheus,暴露 /metrics 供 Prometheus 抓取
Prometheus:
  Host: 0.0.0.0
  Port: 9100
  Path: /metrics