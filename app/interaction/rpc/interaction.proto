syntax = "proto3";

package interaction;

option go_package = "./interaction_pb";

message CommentVideoRequest {
    string user_id = 1;
    string video_id = 2;
    string comment_text = 3;
}

message CommentVideoResponse {
    string comment_id = 1;
}

message ReplyCommentRequest {
    string user_id = 1;
    string comment_text = 2;
    string parent_comment_id = 3;
}

message ReplyCommentResponse {
    string comment_id = 1;
}

message DeleteCommentRequest {
    string comment_id = 1;
    string user_id = 2;
}

message DeleteCommentResponse {
}

message GetCommentListRequest {
    string video_id = 1;
    int32 page_num = 2;
    int32 page_size = 3;
}

message CommentInfo {
    string comment_id = 1;
    string user_id = 2;
    string video_id = 3;
    string content = 4;
    string parent_comment_id = 5;
    string created_at = 6;
}

message GetCommentListResponse {
    repeated CommentInfo comments = 1;
    int64 total = 2;
}

message LikeCommentRequest {
    string comment_id = 1;
    string user_id = 2;
    int32 like_type = 3;  // 1-点赞 0-取消点赞
}

message LikeCommentResponse {
}

service InteractionService {
    rpc CommentVideo(CommentVideoRequest) returns (CommentVideoResponse);
    rpc ReplyComment(ReplyCommentRequest) returns (ReplyCommentResponse);
    rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
    rpc GetCommentList(GetCommentListRequest) returns (GetCommentListResponse);
    rpc LikeComment(LikeCommentRequest) returns (LikeCommentResponse);
}
