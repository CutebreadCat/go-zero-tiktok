syntax = "proto3";

package interaction;

option go_package = "./interaction_pb";

// ================= 评论相关 =================

message CommentVideoRequest {
    int64 user_id = 1;
    int64 video_id = 2;
    string comment_text = 3;
}

message CommentVideoResponse {
    int64 comment_id = 1;
}

message ReplyCommentRequest {
    int64 user_id = 1;
    string comment_text = 2;
    int64 parent_comment_id = 3;
}

message ReplyCommentResponse {
    int64 comment_id = 1;
}

message DeleteCommentRequest {
    int64 comment_id = 1;
    int64 user_id = 2;
}

message DeleteCommentResponse {
}

message GetCommentListRequest {
    int64 video_id = 1;
    int32 page_num = 2;
    int32 page_size = 3;
}

message CommentInfo {
    int64 comment_id = 1;
    int64 user_id = 2;
    int64 video_id = 3;
    string content = 4;
    int64 parent_comment_id = 5;
    string created_at = 6;
}

message GetCommentListResponse {
    repeated CommentInfo comments = 1;
    int64 total = 2;
}

message LikeCommentRequest {
    int64 comment_id = 1;
    int64 user_id = 2;
    int32 like_type = 3;  // 1-点赞 0-取消点赞
}

message LikeCommentResponse {
}

// ================= 视频互动相关 =================

message LikeVideoRequest {
    int64 user_id = 1;
    int64 video_id = 2;
    int32 action_type = 3;  // 1-点赞 0-取消点赞
}

message LikeVideoResponse {
}

message FavoriteVideoRequest {
    int64 user_id = 1;
    int64 video_id = 2;
}

message FavoriteVideoResponse {
}

message CancelFavoriteVideoRequest {
    int64 user_id = 1;
    int64 video_id = 2;
}

message CancelFavoriteVideoResponse {
}

message GetLikeListRequest {
    int64 user_id = 1;
    int32 page_num = 2;
    int32 page_size = 3;
}

message GetLikeListResponse {
    repeated int64 video_ids = 1;
    int64 total = 2;
}

message GetFavoriteListRequest {
    int64 user_id = 1;
    int32 page_num = 2;
    int32 page_size = 3;
}

message GetFavoriteListResponse {
    repeated int64 video_ids = 1;
    int64 total = 2;
}

message BatchGetVideoInteractionStatsRequest {
    repeated int64 video_ids = 1;
}

message VideoInteractionStat {
    int64 video_id = 1;
    int64 like_count = 2;
    int64 favorite_count = 3;
}

message BatchGetVideoInteractionStatsResponse {
    repeated VideoInteractionStat stats = 1;
}

service InteractionService {
    // 评论
    rpc CommentVideo(CommentVideoRequest) returns (CommentVideoResponse);
    rpc ReplyComment(ReplyCommentRequest) returns (ReplyCommentResponse);
    rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
    rpc GetCommentList(GetCommentListRequest) returns (GetCommentListResponse);
    rpc LikeComment(LikeCommentRequest) returns (LikeCommentResponse);

    // 视频互动
    rpc LikeVideo(LikeVideoRequest) returns (LikeVideoResponse);
    rpc FavoriteVideo(FavoriteVideoRequest) returns (FavoriteVideoResponse);
    rpc CancelFavoriteVideo(CancelFavoriteVideoRequest) returns (CancelFavoriteVideoResponse);
    rpc GetLikeList(GetLikeListRequest) returns (GetLikeListResponse);
    rpc GetFavoriteList(GetFavoriteListRequest) returns (GetFavoriteListResponse);
    rpc BatchGetVideoInteractionStats(BatchGetVideoInteractionStatsRequest) returns (BatchGetVideoInteractionStatsResponse);
}
