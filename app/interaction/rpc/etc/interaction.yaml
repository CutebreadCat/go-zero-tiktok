Name: interaction.rpc
ListenOn: 0.0.0.0:8892
Etcd:
  Hosts:
  - "${ETCD_HOSTS}"
  Key: interaction.rpc

DataSource: "root:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/gozero-tiktok?charset=utf8mb4&parseTime=True&loc=Local"

AppRedis:
  Host: "${REDIS_HOST}"
  Type: node

Kafka:
  Brokers:
  - "${KAFKA_BROKERS}"
  Topic: "video-like-events"
  GroupID: "video-like-consumer-group"
  Enable: true
  WorkerCount: 10
  QueueSize: 1000

LikeSync:
  Enable: true
  Interval: 300s
  BatchSize: 100

# 链路追踪:go-zero 内置 Telemetry(OTLP gRPC 导出,可接 Tempo/Jaeger)
Telemetry:
  Name: interaction-rpc
  Endpoint: "${OTLP_ENDPOINT}"
  Sampler: 1.0
  Batcher: otlpgrpc

# 监控指标:go-zero 内置 Prometheus,暴露 /metrics 供 Prometheus 抓取
Prometheus:
  Host: 0.0.0.0
  Port: 9103
  Path: /metrics
